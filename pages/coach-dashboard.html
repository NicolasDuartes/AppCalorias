<!DOCTYPE html>
<html lang="es" class="h-full">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panel Coach - AppCalorias</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body class="w-full h-screen bg-[#3D553E] m-0 p-0 overflow-hidden flex justify-center text-slate-800">

    <div
        class="relative w-full md:max-w-2xl lg:max-w-3xl h-full bg-[#507052] flex flex-col justify-between shadow-2xl overflow-hidden">

        <!-- CABECERA DEL COACH -->
        <header class="w-full shrink-0 z-20 px-4 pt-5 pb-4">
            <div class="flex items-center justify-between pb-4">
                <div>
                    <h1 class="text-white text-2xl font-bold tracking-tight">Hola, Coach</h1>
                    <p class="text-white/80 text-xs font-medium mt-0.5">Resumen de hoy, 24 Octubre</p>
                </div>
                <div
                    class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center border border-white/20 shadow-inner">
                    <span class="text-lg">📋</span>
                </div>
            </div>

            <!-- Métricas Rápidas -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-[#F8FAFC] rounded-2xl p-3.5 shadow-sm border border-white/40">
                    <span class="text-[10px] font-extrabold uppercase tracking-wider text-[#64748B]">Alumnos
                        Activos</span>
                    <div class="text-2xl font-extrabold text-[#1E293B] mt-0.5">12</div>
                </div>
                <div class="bg-[#F8FAFC] rounded-2xl p-3.5 shadow-sm border border-white/40">
                    <span class="text-[10px] font-extrabold uppercase tracking-wider text-[#64748B]">Planes por
                        revisar</span>
                    <div class="text-2xl font-extrabold text-[#D97706] mt-0.5">3</div>
                </div>
            </div>
        </header>

        <!-- LISTA DE ALUMNOS (Fondo Blanco Simulando Modal Fijo) -->
        <main
            class="w-full flex-1 min-h-0 bg-[#F8FAFC] rounded-t-[32px] overflow-hidden flex flex-col shadow-[0_-8px_20px_rgba(0,0,0,0.15)] z-10">
            <div class="w-full px-5 pt-6 pb-2 shrink-0 flex items-center justify-between">
                <h2 class="text-base font-bold text-[#0E141A] tracking-tight">Directorio de Alumnos</h2>
                <button
                    class="w-8 h-8 rounded-full bg-[#E2E8F0] flex items-center justify-center text-[#64748B] hover:bg-[#CBD5E1] transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto hide-scrollbar px-4 pb-6 space-y-3">

                <!-- Tarjeta Alumno 1 -->
                <article class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm flex flex-col gap-3">
                    <div class="flex items-start justify-between">
                        <div class="flex items-center gap-3">
                            <div
                                class="w-10 h-10 rounded-full bg-[#DCFCE7] flex items-center justify-center text-[#15803D] font-bold text-sm border border-[#BBF7D0]">
                                JP
                            </div>
                            <div>
                                <h3 class="font-bold text-[#1E293B] text-sm">Juan Pérez</h3>
                                <p class="text-[10px] text-[#64748B] font-medium">Hipertrofia • 2300 kcal</p>
                            </div>
                        </div>
                        <span
                            class="px-2 py-0.5 rounded-full bg-[#DCFCE7] text-[#15803D] font-bold text-[10px] flex items-center gap-1 border border-[#86EFAC]/50">
                            <span class="w-1.5 h-1.5 rounded-full bg-[#22C55E]"></span> 95% Adherencia
                        </span>
                    </div>
                    <div class="grid grid-cols-2 gap-2 mt-1">
                        <button
                            class="py-2 rounded-xl bg-[#F1F5F9] hover:bg-[#E2E8F0] text-[#475569] font-bold text-[11px] transition-colors">
                            Ver plan
                        </button>
                        <button
                            class="py-2 rounded-xl bg-[#22C55E] text-[#0E141A] font-bold text-[11px] shadow-sm active:scale-95 transition-transform">
                            Revisar Diario
                        </button>
                    </div>
                </article>

                <!-- Tarjeta Alumno 2 -->
                <article class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm flex flex-col gap-3">
                    <div class="flex items-start justify-between">
                        <div class="flex items-center gap-3">
                            <div
                                class="w-10 h-10 rounded-full bg-[#FEE2E2] flex items-center justify-center text-[#DC2626] font-bold text-sm border border-[#FECACA]">
                                LM
                            </div>
                            <div>
                                <h3 class="font-bold text-[#1E293B] text-sm">Laura Méndez</h3>
                                <p class="text-[10px] text-[#64748B] font-medium">Pérdida de grasa • 1600 kcal</p>
                            </div>
                        </div>
                        <span
                            class="px-2 py-0.5 rounded-full bg-[#FEF3C7] text-[#D97706] font-bold text-[10px] flex items-center gap-1 border border-[#FDE68A]/50">
                            <span class="w-1.5 h-1.5 rounded-full bg-[#F59E0B]"></span> 65% Adherencia
                        </span>
                    </div>
                    <div class="grid grid-cols-2 gap-2 mt-1">
                        <button
                            class="py-2 rounded-xl bg-[#F1F5F9] hover:bg-[#E2E8F0] text-[#475569] font-bold text-[11px] transition-colors">
                            Ver plan
                        </button>
                        <button
                            class="py-2 rounded-xl bg-[#22C55E] text-[#0E141A] font-bold text-[11px] shadow-sm active:scale-95 transition-transform">
                            Revisar Diario
                        </button>
                    </div>
                </article>

            </div>
        </main>

        <!-- MENÚ INFERIOR FIJO DEL COACH -->
        <nav
            class="w-full h-[64px] shrink-0 bg-[#0E141A]/95 backdrop-blur-md border-t border-white/10 flex items-center justify-around px-2 z-30">
            <button class="flex flex-col items-center justify-center flex-1 text-[#22C55E] gap-0.5">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z">
                    </path>
                </svg>
                <span class="text-[10px] font-bold">Panel</span>
            </button>
            <button
                class="flex flex-col items-center justify-center flex-1 text-[#94A3B8] hover:text-white transition-colors gap-0.5">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z">
                    </path>
                </svg>
                <span class="text-[10px] font-medium">Alumnos</span>
            </button>
            <button
                class="flex flex-col items-center justify-center flex-1 text-[#94A3B8] hover:text-white transition-colors gap-0.5">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2">
                    </path>
                </svg>
                <span class="text-[10px] font-medium">Plantillas</span>
            </button>
        </nav>
    </div>

</body>

</html>
