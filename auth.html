<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso | AppCalorias</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥑</text></svg>">
  
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .auth-container {
      max-width: 400px;
      margin: 4rem auto;
      padding: 2rem;
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-md);
    }
    .auth-tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .auth-tab {
      flex: 1;
      padding: 0.75rem;
      text-align: center;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    .auth-tab.active {
      color: var(--accent-primary);
      border-bottom-color: var(--accent-primary);
    }
    .auth-form {
      display: none;
    }
    .auth-form.active {
      display: block;
    }
    #auth-message {
      margin-top: 1rem;
      padding: 1rem;
      border-radius: var(--radius-sm);
      display: none;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .msg-error {
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }
    .msg-success {
      background: rgba(16, 185, 129, 0.1);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="app-header" style="justify-content: center;">
      <div class="logo-area">
        <div class="logo-icon">🥑</div>
        <div>
          <h1 class="brand-title">AppCalorias</h1>
          <p class="brand-subtitle">Plataforma Nutricional</p>
        </div>
      </div>
    </header>

    <main>
      <div class="auth-container">
        <div class="auth-tabs">
          <button class="auth-tab active" data-target="login">Iniciar Sesión</button>
          <button class="auth-tab" data-target="register">Registrarse</button>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="auth-form active">
          <div class="form-group" style="margin-bottom: 1rem;">
            <label class="form-label" for="login-email">Email</label>
            <input type="email" id="login-email" class="form-control" required placeholder="tu@email.com">
          </div>
          <div class="form-group" style="margin-bottom: 1.5rem;">
            <label class="form-label" for="login-password">Contraseña</label>
            <input type="password" id="login-password" class="form-control" required placeholder="••••••••">
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%;">Ingresar</button>
        </form>

        <!-- Register Form -->
        <form id="register-form" class="auth-form">
          <div class="form-group" style="margin-bottom: 1rem;">
            <label class="form-label" for="reg-name">Nombre Completo</label>
            <input type="text" id="reg-name" class="form-control" required placeholder="Juan Pérez">
          </div>
          <div class="form-group" style="margin-bottom: 1rem;">
            <label class="form-label" for="reg-email">Email</label>
            <input type="email" id="reg-email" class="form-control" required placeholder="tu@email.com">
          </div>
          <div class="form-group" style="margin-bottom: 1.5rem;">
            <label class="form-label" for="reg-password">Contraseña</label>
            <input type="password" id="reg-password" class="form-control" required placeholder="Mínimo 6 caracteres" minlength="6">
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%;">Crear Cuenta</button>
          
          <p style="margin-top: 1rem; font-size: 0.85rem; color: var(--text-muted); text-align: center;">
            Al registrarte, entrarás en una cola de espera para ser asignado a un Coach.
          </p>
        </form>

        <div id="auth-message"></div>
      </div>
    </main>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
