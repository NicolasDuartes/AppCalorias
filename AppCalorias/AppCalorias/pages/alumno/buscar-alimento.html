<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Añadir alimento · Alumno</title>
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/components.css">
</head>
<body>
  <div class="pantalla fondo-oscurecido">
    <!-- Fondo: pantalla del editor oscurecida detrás de la hoja -->
    <section class="hoja" role="dialog" aria-modal="true" aria-labelledby="t-hoja">
      <div class="hoja__agarre"><span></span></div>
      <div class="hoja__cabecera">
        <div class="fila fila--entre">
          <div class="columna">
            <h1 class="titulo" id="t-hoja">Añadir alimento</h1>
            <span><span class="tag tag--verde">Desayuno</span></span>
          </div>
          <a class="btn-icono" href="plan-editor.html" aria-label="Cerrar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></a>
        </div>
        <label class="buscador">
          <span class="texto-gris"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3"/></svg></span>
          <span class="sr-only">Buscar alimento</span>
          <input type="search" name="buscar" placeholder="Buscar alimento" value="pollo">
        </label>
        <div class="chips" role="group" aria-label="Categorías">
          <button class="chip" type="button" aria-pressed="false">Todos</button>
          <button class="chip" type="button" aria-pressed="true">Proteínas</button>
          <button class="chip" type="button" aria-pressed="false">Cereales</button>
          <button class="chip" type="button" aria-pressed="false">Lácteos</button>
          <button class="chip" type="button" aria-pressed="false">Grasas</button>
          <button class="chip" type="button" aria-pressed="false">Frutas y verduras</button>
        </div>
        <div class="pestanas" role="tablist" aria-label="Origen de los alimentos">
          <button type="button" role="tab" aria-selected="true">Frecuentes</button>
          <button type="button" role="tab" aria-selected="false">Mis alimentos</button>
          <button type="button" role="tab" aria-selected="false">Base de datos general</button>
        </div>
      </div>

      <div class="hoja__lista">
        <div class="lista" role="listbox" aria-label="Resultados">
          <button class="resultado-alimento" type="button" role="option" aria-selected="true">
            <span class="resultado-alimento__linea"><span class="negrita texto-15">Pechuga de pollo cocida</span><span class="num num--s">165 <span class="unidad">kcal</span></span></span>
            <span class="resultado-alimento__linea"><span class="sub">Cocido · por 100 g</span><span class="sub">P 31 · C 0 · G 3,6</span></span>
          </button>
          <button class="resultado-alimento" type="button" role="option" aria-selected="false">
            <span class="resultado-alimento__linea"><span class="negrita texto-15">Muslo de pollo sin piel</span><span class="num num--s">177 <span class="unidad">kcal</span></span></span>
            <span class="resultado-alimento__linea"><span class="sub">Cocido · por 100 g</span><span class="sub">P 24 · C 0 · G 8,4</span></span>
          </button>
          <button class="resultado-alimento" type="button" role="option" aria-selected="false">
            <span class="resultado-alimento__linea"><span class="negrita texto-15">Carne vacuna magra</span><span class="num num--s">158 <span class="unidad">kcal</span></span></span>
            <span class="resultado-alimento__linea"><span class="sub">Cocida · por 100 g</span><span class="sub">P 26 · C 0 · G 6</span></span>
          </button>
          <button class="resultado-alimento" type="button" role="option" aria-selected="false">
            <span class="resultado-alimento__linea"><span class="negrita texto-15">Huevo entero</span><span class="num num--s">143 <span class="unidad">kcal</span></span></span>
            <span class="resultado-alimento__linea"><span class="sub">Crudo · por 100 g</span><span class="sub">P 12,6 · C 0,7 · G 9,5</span></span>
          </button>
          <button class="resultado-alimento" type="button" role="option" aria-selected="false">
            <span class="resultado-alimento__linea"><span class="negrita texto-15">Atún al natural</span><span class="num num--s">116 <span class="unidad">kcal</span></span></span>
            <span class="resultado-alimento__linea"><span class="sub">Enlatado · por 100 g</span><span class="sub">P 26 · C 0 · G 1</span></span>
          </button>
          <button class="resultado-alimento" type="button" role="option" aria-selected="false">
            <span class="resultado-alimento__linea"><span class="negrita texto-15">Merluza</span><span class="num num--s">90 <span class="unidad">kcal</span></span></span>
            <span class="resultado-alimento__linea"><span class="sub">Cocida · por 100 g</span><span class="sub">P 18 · C 0 · G 1,3</span></span>
          </button>
          <button class="resultado-alimento" type="button" role="option" aria-selected="false">
            <span class="resultado-alimento__linea"><span class="negrita texto-15">Tofu firme</span><span class="num num--s">144 <span class="unidad">kcal</span></span></span>
            <span class="resultado-alimento__linea"><span class="sub">Crudo · por 100 g</span><span class="sub">P 17 · C 3 · G 9</span></span>
          </button>
        </div>
      </div>

      <div class="hoja__pie">
        <div class="fila">
          <div class="crece columna">
            <span class="negrita texto-15">Pechuga de pollo cocida</span>
            <span class="sub">248 kcal · P 46,5 · C 0 · G 5,4</span>
          </div>
          <label class="input input--derecha input--angosto">
            <span class="sr-only">Cantidad</span>
            <input type="text" inputmode="decimal" name="cantidad" value="150"><span class="unidad">g</span>
          </label>
        </div>
        <a class="btn btn--primario" href="plan-editor.html">Agregar a la comida</a>
      </div>
    </section>
  </div>
</body>
</html>
