<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalle del alimento · Alumno</title>
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/components.css">
</head>
<body>
  <div class="pantalla">
    <main class="contenido" style="gap: 18px">
      <header class="fila fila--entre">
        <a class="btn-icono" href="agregar.html" aria-label="Volver"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
        <button class="btn-icono btn-icono--favorito" type="button" aria-pressed="true" aria-label="Quitar de favoritos"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.3a4.2 4.2 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z"/></svg></button>
      </header>

      <div class="columna" style="gap: 6px">
        <span class="antetitulo antetitulo--verde">Receta casera</span>
        <h1 class="titulo titulo--grande">Milanesa de pollo al horno</h1>
      </div>

      <section class="card" style="padding: 20px; gap: 18px" aria-label="Porción">
        <div class="fila fila--entre" style="align-items: flex-end">
          <div class="columna" style="gap: 0">
            <span class="num num--xl">285</span>
            <span class="sub texto-14">kcal · 150 g</span>
          </div>
          <div class="contador" role="group" aria-label="Cantidad">
            <button type="button" aria-label="Menos cantidad"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
            <output>1</output>
            <button type="button" aria-label="Más cantidad"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
          </div>
        </div>

        <div class="fila" style="gap: 8px" role="group" aria-label="Unidad">
          <button class="chip chip--ancho" type="button" aria-pressed="true">Unidad · 150 g</button>
          <button class="chip chip--ancho" type="button" aria-pressed="false">100 g</button>
          <button class="chip chip--ancho" type="button" aria-pressed="false">Porción · 200 g</button>
        </div>

        <div class="columna" style="gap: 10px">
          <div class="reparto"><span class="p" style="width: 50%"></span><span class="c" style="width: 19%"></span><span class="g" style="width: 31%"></span></div>
          <div class="macros">
            <div class="macro"><span class="macro__nombre"><span class="punto punto--p"></span>Proteínas</span><span class="num num--m">36 g</span></div>
            <div class="macro"><span class="macro__nombre"><span class="punto punto--c"></span>Carbohidr.</span><span class="num num--m">13,5 g</span></div>
            <div class="macro"><span class="macro__nombre"><span class="punto punto--g"></span>Grasas</span><span class="num num--m">9,8 g</span></div>
          </div>
        </div>
      </section>

      <section class="card" style="padding: 6px 20px" aria-labelledby="t-nutrientes">
        <h2 class="seccion-titulo" id="t-nutrientes" style="margin: 8px 0 0">Más nutrientes</h2>
        <div class="lista-datos">
          <div><span>Fibra</span><span>0,9 g</span></div>
          <div><span>Azúcares</span><span>1,2 g</span></div>
          <div><span>Grasas saturadas</span><span>2,4 g</span></div>
          <div><span>Sodio</span><span>630 mg</span></div>
        </div>
      </section>

      <p class="sub">Valores estimados a partir de tu receta guardada.</p>
    </main>

    <div class="pie">
      <a class="btn btn--primario btn--alto" href="agregar.html">Agregar a la cena · 285 kcal</a>
    </div>
  </div>
</body>
</html>
