    <script>
        let selectedRole = 'alumno';

        function selectRole(role) {
            selectedRole = role;
            const btnAlumno = document.getElementById('btn-role-alumno');
            const btnCoach = document.getElementById('btn-role-coach');
            const checkAlumno = document.getElementById('check-alumno');
            const checkCoach = document.getElementById('check-coach');

            if (role === 'alumno') {
                btnAlumno.className = 'relative flex flex-col items-center justify-center p-4 rounded-2xl border-2 border-[#22C55E] bg-[#F0FDF4] transition-all duration-200 shadow-sm';
                checkAlumno.className = 'absolute top-2 right-2 w-4 h-4 rounded-full bg-[#22C55E] flex items-center justify-center';
                checkAlumno.innerHTML = '<div class="w-1.5 h-1.5 bg-white rounded-full"></div>';

                btnCoach.className = 'relative flex flex-col items-center justify-center p-4 rounded-2xl border-2 border-[#E2E8F0] bg-white hover:bg-gray-50 transition-all duration-200';
                checkCoach.className = 'absolute top-2 right-2 w-4 h-4 rounded-full border-2 border-[#CBD5E1] bg-transparent';
                checkCoach.innerHTML = '';
            } else {
                btnCoach.className = 'relative flex flex-col items-center justify-center p-4 rounded-2xl border-2 border-[#22C55E] bg-[#F0FDF4] transition-all duration-200 shadow-sm';
                checkCoach.className = 'absolute top-2 right-2 w-4 h-4 rounded-full bg-[#22C55E] flex items-center justify-center';
                checkCoach.innerHTML = '<div class="w-1.5 h-1.5 bg-white rounded-full"></div>';

                btnAlumno.className = 'relative flex flex-col items-center justify-center p-4 rounded-2xl border-2 border-[#E2E8F0] bg-white hover:bg-gray-50 transition-all duration-200';
                checkAlumno.className = 'absolute top-2 right-2 w-4 h-4 rounded-full border-2 border-[#CBD5E1] bg-transparent';
                checkAlumno.innerHTML = '';
            }
        }

        function handleRegistro(event) {
            event.preventDefault();

            // Rutas actualizadas para redirigir a la carpeta pages/
            if (selectedRole === 'alumno') {
                window.location.href = 'pages/alumno.html';
            } else {
                window.location.href = 'pages/coach-dashboard.html';
            }
        }
    </script>
