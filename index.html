<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - AppCalorias</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="w-full h-screen bg-[#3D553E] flex items-center justify-center p-4">
    
    <main class="w-full max-w-sm bg-white rounded-[32px] p-8 shadow-2xl border-t border-white/20 relative overflow-hidden">
        <!-- Decoración visual -->
        <div class="absolute top-0 right-0 -mr-16 -mt-16 w-48 h-48 bg-[#DCFCE7] rounded-full opacity-50 blur-3xl pointer-events-none"></div>
        
        <div class="relative z-10">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-[#22C55E] rounded-2xl mx-auto mb-4 shadow-lg flex items-center justify-center text-white text-3xl">
                    🥑
                </div>
                <h1 class="text-2xl font-extrabold text-[#0E141A] tracking-tight">AppCalorias</h1>
                <p class="text-xs font-medium text-[#64748B] mt-1.5">Ingresa para ver tu plan nutricional</p>
            </div>

            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-[11px] font-extrabold uppercase tracking-wider text-[#64748B] mb-1.5 ml-1">Correo Electrónico</label>
                    <input type="email" id="email" required
                        class="w-full bg-[#F8FAFC] border border-gray-200 text-sm font-bold text-gray-900 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#22C55E] transition-all"
                        placeholder="tu@email.com">
                </div>
                <div>
                    <label class="block text-[11px] font-extrabold uppercase tracking-wider text-[#64748B] mb-1.5 ml-1">Contraseña</label>
                    <input type="password" id="password" required
                        class="w-full bg-[#F8FAFC] border border-gray-200 text-sm font-bold text-gray-900 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#22C55E] transition-all"
                        placeholder="••••••••">
                </div>
                
                <button type="submit" id="btn-submit"
                    class="w-full bg-[#0E141A] text-white font-extrabold text-sm py-3.5 rounded-xl mt-2 shadow-md hover:bg-[#1E293B] active:scale-[0.98] transition-all">
                    Iniciar Sesión
                </button>
            </form>
            
            <div id="error-msg" class="hidden mt-4 text-center text-xs font-bold text-red-500 bg-red-50 py-2.5 rounded-xl border border-red-100"></div>
        </div>
    </main>

    <script type="module">
        import { supabase } from './js/supabase.js';

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btn-submit');
            const errorBox = document.getElementById('error-msg');

            btn.innerText = "Verificando credenciales...";
            btn.classList.add('opacity-75');
            btn.disabled = true;
            errorBox.classList.add('hidden');

            try {
                // 1. Capa de Seguridad: Autenticación nativa
                const { data: authData, error: authError } = await supabase.auth.signInWithPassword({ email, password });
                if (authError) throw authError;

                // 2. Capa Lógica: Consulta a la tabla de JUAN (profiles)
                const { data: perfilData, error: perfilError } = await supabase
                    .from('profiles')
                    .select('role') // Asegurate de que Juan le haya puesto "role" y no "rol"
                    .eq('id', authData.user.id)
                    .single();

                if (perfilError) throw perfilError;

                // 3. Enrutamiento dinámico
                if (perfilData.role === 'coach') {
                    window.location.href = './pages/coach-dashboard.html';
                } else {
                    window.location.href = './pages/alumno.html';
                }

            } catch (error) {
                console.error("Error de acceso:", error);
                errorBox.innerText = "Acceso denegado. Verifica tus credenciales.";
                errorBox.classList.remove('hidden');
                btn.innerText = "Iniciar Sesión";
                btn.classList.remove('opacity-75');
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
