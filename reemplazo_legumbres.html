<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diario de Nutrición - Menú Reemplazo Legumbres</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; background-color: #507052; -webkit-tap-highlight-color: transparent; user-select: none; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen w-full flex justify-center bg-[#507052] p-0 overflow-hidden">
  <div class="relative w-[390px] h-[917px] bg-[#507052] overflow-hidden flex flex-col justify-between">
    <header class="w-full bg-[#507052] shrink-0 z-20 px-4 pt-5 pb-2 opacity-40">
      <div class="flex items-center justify-between pb-2">
        <h1 class="text-white text-2xl font-bold">Hoy</h1>
      </div>
    </header>
    <main class="w-full flex-1 opacity-40"></main>

    <!-- BOTTOM SHEET: REEMPLAZO LEGUMBRES -->
    <div id="modal-reemplazo" class="absolute inset-0 bg-black/60 backdrop-blur-xs z-50 flex flex-col justify-end">
      <div class="bg-white rounded-t-[28px] p-5 pb-7 shadow-2xl w-full mx-auto border-t border-white/40 flex flex-col max-h-[85%]">
        <div class="w-12 h-1.5 bg-[#CBD5E1] rounded-full mx-auto mb-3 shrink-0"></div>
        <div class="flex items-start justify-between pb-3 border-b border-[#F1F5F9] shrink-0">
          <div>
            <div class="flex items-center gap-2">
              <span class="px-1.5 py-0.5 rounded bg-[#FEE2E2] text-[#DC2626] font-bold text-[10px] border border-[#FECACA]">[Legumbre]</span>
              <h3 class="text-base font-bold text-[#0E141A] tracking-tight">Reemplazar Legumbres</h3>
            </div>
            <p class="text-[11px] text-[#64748B] font-medium mt-0.5">Porción fija: 1 porc. (~20g HC • 8g P)</p>
          </div>
          <button class="w-8 h-8 rounded-full bg-[#F1F5F9] text-[#64748B] flex items-center justify-center">✕</button>
        </div>

        <div class="overflow-y-auto py-2 space-y-2 mt-1 hide-scrollbar">
          <label class="flex items-center justify-between p-3 rounded-xl border-2 border-[#22C55E] bg-[#F0FDF4] cursor-pointer shadow-xs">
            <div class="flex flex-col">
              <div class="flex items-center gap-2">
                <span class="font-bold text-xs text-[#0E141A]">🫘 Lentejas cocidas</span>
                <span class="text-[9px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded bg-[#DCFCE7] text-[#15803D]">Actual</span>
              </div>
              <span class="text-[11px] text-[#15803D] font-semibold mt-0.5">130g (1/2 taza)</span>
            </div>
            <div class="w-4 h-4 rounded-full border-2 border-[#22C55E] bg-[#22C55E] flex items-center justify-center">
              <div class="w-1.5 h-1.5 rounded-full bg-white"></div>
            </div>
          </label>
          <label class="flex items-center justify-between p-3 rounded-xl border border-[#E2E8F0] bg-[#F8FAFC] cursor-pointer">
            <div class="flex flex-col">
              <span class="font-bold text-xs text-[#1E293B]">🫘 Garbanzos cocidos</span>
              <span class="text-[11px] text-[#64748B] font-medium mt-0.5">120g (1/2 taza)</span>
            </div>
            <div class="w-4 h-4 rounded-full border-2 border-[#CBD5E1] bg-white"></div>
          </label>
          <label class="flex items-center justify-between p-3 rounded-xl border border-[#E2E8F0] bg-[#F8FAFC] cursor-pointer">
            <div class="flex flex-col">
              <span class="font-bold text-xs text-[#1E293B]">🫘 Porotos negros / rojos</span>
              <span class="text-[11px] text-[#64748B] font-medium mt-0.5">120g (1/2 taza)</span>
            </div>
            <div class="w-4 h-4 rounded-full border-2 border-[#CBD5E1] bg-white"></div>
          </label>
        </div>

        <div class="mt-3 pt-2 shrink-0">
          <button class="w-full py-3 rounded-xl bg-[#22C55E] text-[#0E141A] font-extrabold text-xs flex items-center justify-center gap-1.5 shadow-md">
            Confirmar reemplazo
          </button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
