<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/cuenta.css">
</head>
<body>
  <div class="pantalla">
    <main class="contenido" style="padding: 36px 24px 28px; gap: 22px">
      <header class="columna" style="gap: 14px">
        <span class="logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8.2c-1.6-1.2-5-1.4-6.5 1.3-1.5 2.8-.5 6.8 1.5 9.3 1.2 1.5 2.6 1.9 3.7 1.3.8-.4 1.8-.4 2.6 0 1.1.6 2.5.2 3.7-1.3 2-2.5 3-6.5 1.5-9.3-1.5-2.7-4.9-2.5-6.5-1.3z"/><path d="M12 8.2c0-2.2.8-3.9 2.3-5"/><path d="M12.6 6c1.9-.4 3.4.1 4.1 1.4-1.9.6-3.3.2-4.1-1.4z"/></svg></span>
        <div class="columna" style="gap: 6px">
          <h1 class="titulo titulo--grande">Crear cuenta</h1>
          <p class="sub texto-15">Registrá tu alimentación o acompañá a tus clientes.</p>
        </div>
      </header>

      <!-- El tipo elegido cambia el botón final con CSS (:has); el envío lo maneja js/ui/cuenta-ui.js -->
      <form class="form-cuenta columna" style="gap: 22px" novalidate>
        <fieldset class="columna" style="gap: 10px; border: 0; margin: 0; padding: 0">
          <legend class="campo__etiqueta--fuerte" style="margin-bottom: 10px">¿Cómo vas a usar la app?</legend>
          <div class="grilla-2">
          <label class="tipo-cuenta">
            <input class="sr-only" type="radio" name="tipo" id="tipo-alumno" value="alumno" checked>
            <span class="fila fila--entre" style="align-items: flex-start">
              <span class="tipo-cuenta__icono"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></span>
              <span class="radio"></span>
            </span>
            <span class="negrita" style="font-weight: 700">Alumno</span>
            <span class="sub">Registrá tus comidas y seguí tu plan.</span>
          </label>
          <label class="tipo-cuenta">
            <input class="sr-only" type="radio" name="tipo" id="tipo-coach" value="coach">
            <span class="fila fila--entre" style="align-items: flex-start">
              <span class="tipo-cuenta__icono"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.9-3.4 3.4-5.2 6.5-5.2s5.6 1.8 6.5 5.2"/><path d="M15.5 4.7a3.3 3.3 0 0 1 0 6.4"/><path d="M17.5 14.9c2 .5 3.4 2.1 4 5.1"/></svg></span>
              <span class="radio"></span>
            </span>
            <span class="negrita" style="font-weight: 700">Coach</span>
            <span class="sub">Armá planes y acompañá a tus clientes.</span>
          </label>
          </div>
        </fieldset>

        <div class="columna" style="gap: 14px">
          <label class="campo">
            <span class="campo__etiqueta campo__etiqueta--fuerte">Nombre de usuario</span>
            <span class="input input--alto"><span class="input__prefijo" aria-hidden="true">@</span><input type="text" name="usuario" autocomplete="username" placeholder="tu.usuario" required minlength="3" maxlength="30" pattern="[a-z0-9._]{3,30}" autocapitalize="none" spellcheck="false" aria-describedby="usuario-ayuda"></span>
            <span class="sub ayuda-usuario" id="usuario-ayuda" aria-live="polite">Minúsculas, números, punto o guion bajo.</span>
          </label>
          <label class="campo">
            <span class="campo__etiqueta campo__etiqueta--fuerte">Correo electrónico</span>
            <span class="input input--alto"><input type="email" name="correo" autocomplete="email" placeholder="nombre@correo.com" required></span>
          </label>
          <div class="campo">
            <label class="campo__etiqueta campo__etiqueta--fuerte" for="clave">Contraseña</label>
            <span class="input input--alto" style="padding-right: 4px">
              <input id="clave" type="password" name="clave" autocomplete="new-password" required minlength="8" aria-describedby="clave-ayuda">
              <button class="btn-accion" type="button" id="ver-clave" aria-pressed="false" aria-label="Mostrar contraseña" style="color: var(--gris)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </span>
            <div class="fuerza" data-nivel="0" aria-hidden="true"><span></span><span></span><span></span></div>
            <span class="sub" id="clave-ayuda" style="font-size: 12px">Mínimo 8 caracteres, con letras y números.</span>
          </div>
        </div>

        <label class="casilla">
          <input type="checkbox" id="acepta" name="acepta" checked>
          <span>Acepto los términos y la política de privacidad.</span>
        </label>

        <div class="columna" style="gap: 12px">
          <p class="mensaje-cuenta" id="mensaje-cuenta" role="alert" hidden></p>
          <button class="btn btn--primario btn--alto cta-crear solo-alumno" type="submit">Crear cuenta de alumno</button>
          <button class="btn btn--primario btn--alto cta-crear solo-coach" type="submit">Crear cuenta de coach</button>
          <p class="nota-centrada aviso-terminos" style="font-size: 13px">Aceptá los términos para continuar.</p>
          <p class="derecha" style="text-align: center; font-size: 14px; color: var(--gris-oscuro)">¿Ya tenés cuenta? <a class="negrita" href="login.html">Iniciá sesión</a></p>
        </div>
      </form>
    </main>
  </div>
  <script type="module" src="js/ui/cuenta-ui.js"></script>
</body>
</html>
