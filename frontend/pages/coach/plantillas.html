<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plantillas de planes · Coach</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/pages/coach.css">
</head>
<body>
  <!-- Iconos de esta página: se dibujan con <svg class="icono"><use href="#nombre"/></svg> -->
  <svg class="sprite" aria-hidden="true">
    <symbol id="plantillas" viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></symbol>
    <symbol id="clientes" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14c2.9.2 5 2.3 5 5.5"/></symbol>
    <symbol id="alimentos" viewBox="0 0 24 24"><path d="M12 7c-1.5-1-5-1.3-6.3 1.7-1.4 3.2.3 8 2.3 10.5 1.2 1.5 2.4 1.3 4 .6 1.6.7 2.8.9 4-.6 2-2.5 3.7-7.3 2.3-10.5C17 5.7 13.5 6 12 7z"/><path d="M12 7c0-2 1-3.5 3-4"/></symbol>
    <symbol id="perfil" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></symbol>
    <symbol id="mas" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="flecha-derecha" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="fuego" viewBox="0 0 24 24"><path d="M12 2c1 3 4 5.5 4 9a6 6 0 1 1-12 0c0-3.5 3-6 4-9 0 2.5 2 4 4 4s0-2 0-4z"/></symbol>
    <symbol id="volver" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  </svg>

  <div class="pantalla">
    <main class="contenido contenido--holgado">
      <!-- ===== Encabezado ===== -->
      <header class="encabezado">
        <a class="btn-icono" id="boton-volver" href="clientes.html" aria-label="Volver"><svg class="icono" width="22" height="22" aria-hidden="true"><use href="#volver"/></svg></a>
        <div class="encabezado__textos">
          <h1 class="titulo">Plantillas de planes</h1>
          <p class="sub" id="subtitulo-catalogo">Bases nutricionales prediseñadas para asignar o adaptar en el editor.</p>
        </div>
      </header>

      <!-- ===== Sección Catálogo de Plantillas ===== -->
      <section class="columna" aria-labelledby="titulo-catalogo-seccion">
        <h2 class="sr-only" id="titulo-catalogo-seccion">Catálogo de plantillas de planes</h2>

        <!-- Template para renderizado dinámico seguro de cada tarjeta -->
        <template id="tpl-plantilla-card">
          <article class="card card--plantilla" data-plantilla-id="">
            <div class="card__fila">
              <h3 class="titulo titulo--chico" data-ref="titulo"></h3>
              <div class="fila gap-xs" data-ref="tags"></div>
            </div>
            <p class="sub texto-13" data-ref="descripcion"></p>

            <div class="card__fila">
              <p><svg class="icono texto-naranja" width="18" height="18" aria-hidden="true"><use href="#fuego"/></svg> <span class="num num--m" data-ref="kcal"></span> <span class="unidad">kcal/día</span></p>
              <span class="sub texto-13" data-ref="comidas-count">4 comidas</span>
            </div>

            <div class="reparto" role="progressbar" aria-label="Distribución de macronutrientes">
              <span class="p" data-ref="barra-p"></span>
              <span class="c" data-ref="barra-c"></span>
              <span class="g" data-ref="barra-g"></span>
            </div>

            <div class="macros">
              <div class="macro">
                <span class="macro__nombre"><span class="punto punto--p"></span>Proteínas</span>
                <span class="num num--s"><span data-ref="macro-p"></span> <span class="unidad">g</span></span>
              </div>
              <div class="macro">
                <span class="macro__nombre"><span class="punto punto--c"></span>Carbos</span>
                <span class="num num--s"><span data-ref="macro-c"></span> <span class="unidad">g</span></span>
              </div>
              <div class="macro">
                <span class="macro__nombre"><span class="punto punto--g"></span>Grasas</span>
                <span class="num num--s"><span data-ref="macro-g"></span> <span class="unidad">g</span></span>
              </div>
            </div>

            <div class="card__fila fila--entre">
              <span class="sub texto-12">Atwater: 4P · 4C · 9G</span>
              <a class="btn btn--primario btn--chico" data-ref="btn-usar" href="plan-editor.html">Usar plantilla</a>
            </div>
          </article>
        </template>

        <!-- Contenedor dinámico de plantillas -->
        <div class="columna gap-m" id="lista-plantillas"></div>
      </section>
    </main>

    <!-- ===== Navegación del coach (igual en todas las pantallas del coach) ===== -->
    <nav class="barra-inferior" aria-label="Navegación del coach">
      <a class="barra-inferior__item" href="clientes.html"><svg class="icono" width="22" height="22" aria-hidden="true"><use href="#clientes"/></svg><span>Clientes</span></a>
      <a class="barra-inferior__item" href="plantillas.html" aria-current="page"><svg class="icono" width="22" height="22" aria-hidden="true"><use href="#plantillas"/></svg><span>Plantillas</span></a>
      <a class="barra-inferior__mas" href="clientes.html#anadir-cliente" aria-label="Añadir cliente"><svg class="icono icono--grueso" width="26" height="26" aria-hidden="true"><use href="#mas"/></svg></a>
      <a class="barra-inferior__item" href="alimentos-revision.html"><svg class="icono" width="22" height="22" aria-hidden="true"><use href="#alimentos"/></svg><span>Alimentos</span></a>
      <a class="barra-inferior__item" href="perfil.html"><svg class="icono" width="22" height="22" aria-hidden="true"><use href="#perfil"/></svg><span>Perfil</span></a>
    </nav>
  </div>

  <script type="module" src="../../js/ui/plantillas-ui.js"></script>
</body>
</html>
