<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Añadir alimento · Coach</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/pages/coach.css">
</head>
<body>
  <!-- Iconos de esta página: se dibujan con <svg class="icono"><use href="#nombre"/></svg> -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="cerrar" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
    <symbol id="buscar" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3"/></symbol>
  </svg>
  <div class="pantalla fondo-oscurecido">
    <!-- Fondo: pantalla del editor oscurecida detrás de la hoja -->
    <section class="hoja" role="dialog" aria-modal="true" aria-labelledby="t-hoja">
      <div class="hoja__agarre"><span></span></div>
      <!-- ===== Búsqueda y filtros ===== -->
      <div class="hoja__cabecera">
        <div class="fila fila--entre">
          <div class="columna">
            <h1 class="titulo" id="t-hoja">Añadir alimento</h1>
            <span><span class="tag tag--verde">Almuerzo</span></span>
          </div>
          <a class="btn-icono" href="plan-editor.html" aria-label="Cerrar"><svg class="icono" width="20" height="20" aria-hidden="true"><use href="#cerrar"/></svg></a>
        </div>
        <label class="buscador">
          <span class="texto-gris"><svg class="icono" width="20" height="20" aria-hidden="true"><use href="#buscar"/></svg></span>
          <span class="sr-only">Buscar alimento</span>
          <input type="search" name="buscar" placeholder="Buscar alimento">
        </label>
        <div class="chips" role="group" aria-label="Categorías">
          <button class="chip" type="button" aria-pressed="true">Todos</button>
          <button class="chip" type="button" aria-pressed="false">Proteínas</button>
          <button class="chip" type="button" aria-pressed="false">Cereales</button>
          <button class="chip" type="button" aria-pressed="false">Lácteos</button>
          <button class="chip" type="button" aria-pressed="false">Grasas</button>
          <button class="chip" type="button" aria-pressed="false">Frutas y verduras</button>
        </div>
        <div class="pestanas" role="tablist" aria-label="Origen de los alimentos">
          <button type="button" role="tab" aria-selected="true">Frecuentes</button>
          <button type="button" role="tab" aria-selected="false">Mis alimentos</button>
          <button type="button" role="tab" aria-selected="false">Base de datos general</button>
        </div>
      </div>

      <!-- ===== Resultados ===== -->
      <div class="hoja__lista">
        <!-- Alimentos: vienen de la API de alimentos (pendiente) -->
        <section class="vacio">
          <span class="vacio__icono"><svg class="icono" width="32" height="32" aria-hidden="true"><use href="#buscar"/></svg></span>
          <h2 class="titulo">Buscá un alimento</h2>
          <p class="sub texto-14">Los resultados van a venir de la base de datos de alimentos.</p>
        </section>
      </div>

      <!-- ===== Cantidad y confirmación ===== -->
      <div class="hoja__pie">
        <div class="fila">
          <div class="crece columna">
            <span class="negrita texto-15">Ningún alimento elegido</span>
            <span class="sub">— kcal · P — · C — · G —</span>
          </div>
          <label class="input input--derecha input--angosto">
            <span class="sr-only">Cantidad</span>
            <input type="text" inputmode="decimal" name="cantidad" value="" placeholder="—"><span class="unidad">g</span>
          </label>
        </div>
        <button class="btn btn--primario" type="button" disabled>Agregar a la comida</button>
      </div>
    </section>
  </div>
</body>
</html>
