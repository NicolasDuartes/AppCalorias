<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perfil · Coach</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/pages/coach.css">
</head>
<body>
  <!-- Iconos de esta página: se dibujan con <svg class="icono"><use href="#nombre"/></svg> -->
  <svg class="sprite" aria-hidden="true">
    <symbol id="flecha-derecha" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="mas" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="salir" viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 8l-4 4 4 4M6 12h10"/></symbol>
    <symbol id="clientes" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14c2.9.2 5 2.3 5 5.5"/></symbol>
    <symbol id="plantillas" viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></symbol>
    <symbol id="alimentos" viewBox="0 0 24 24"><path d="M12 7c-1.5-1-5-1.3-6.3 1.7-1.4 3.2.3 8 2.3 10.5 1.2 1.5 2.4 1.3 4 .6 1.6.7 2.8.9 4-.6 2-2.5 3.7-7.3 2.3-10.5C17 5.7 13.5 6 12 7z"/><path d="M12 7c0-2 1-3.5 3-4"/></symbol>
    <symbol id="perfil" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></symbol>
    <symbol id="lapiz" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
    <symbol id="cerrar" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
  </svg>
  <div class="pantalla">
    <main class="contenido contenido--holgado gap-l">
      <!-- Cuenta: js/ui/perfil-coach-ui.js completa el @usuario, las iniciales y el email -->
      <header class="encabezado gap-l">
        <span class="avatar avatar--perfil avatar--naranja" id="perfil-iniciales" role="img" aria-label="Foto de perfil"></span>
        <div class="encabezado__textos gap-2xs">
          <h1 class="titulo" id="perfil-usuario">Cargando…</h1>
          <p class="sub" id="perfil-email"></p>
          <span><span class="tag tag--verde"><span class="tag__punto"></span>Coach</span></span>
        </div>
        <button class="btn-icono" type="button" id="btn-editar-perfil-coach" aria-label="Editar perfil"><svg class="icono icono--grueso" width="18" height="18" aria-hidden="true"><use href="#lapiz"/></svg></button>
      </header>

      <!-- Modal accesible para edición del perfil del coach -->
      <div class="modal" id="modal-editar-perfil-coach" role="dialog" aria-modal="true" aria-labelledby="t-modal-coach" hidden>
        <div class="modal__caja">
          <div class="modal__cabecera">
            <h3 class="titulo texto-16" id="t-modal-coach">Editar perfil de coach</h3>
            <button class="btn-icono" type="button" id="btn-cerrar-modal-coach" aria-label="Cerrar"><svg class="icono" width="18" height="18" aria-hidden="true"><use href="#cerrar"/></svg></button>
          </div>
          <form class="columna gap-m" id="form-editar-coach">
            <label class="campo">
              <span class="campo__etiqueta">Nombre o @usuario</span>
              <input class="input" type="text" name="nombreCoach" id="input-coach-nombre" required maxlength="30">
            </label>
            <label class="campo">
              <span class="campo__etiqueta">Email de contacto</span>
              <input class="input" type="email" name="emailCoach" id="input-coach-email" readonly disabled>
            </label>
            <p class="mensaje" id="mensaje-modal-coach" role="alert" hidden></p>
            <div class="grilla-2">
              <button class="btn btn--secundario" type="button" id="btn-cancelar-coach">Cancelar</button>
              <button class="btn btn--primario" type="submit" id="btn-guardar-coach">Guardar cambios</button>
            </div>
          </form>
        </div>
      </div>

      <p class="mensaje" id="mensaje-perfil" role="alert" hidden></p>

      <section class="lista" aria-labelledby="t-trabajo">
        <h2 class="seccion-titulo" id="t-trabajo">Mi trabajo</h2>
        <a class="fila-link" href="clientes.html">
          <span class="tile"><svg class="icono" width="22" height="22" aria-hidden="true"><use href="#clientes"/></svg></span>
          <span class="fila-link__textos">
            <span class="fila-link__nombre">Mis clientes</span>
            <span class="sub" id="cantidad-clientes">—</span>
          </span>
          <span class="chevron"><svg class="icono" width="20" height="20" aria-hidden="true"><use href="#flecha-derecha"/></svg></span>
        </a>
      </section>

      <button class="btn btn--peligro-texto" type="button" id="cerrar-sesion"><svg class="icono" width="18" height="18" aria-hidden="true"><use href="#salir"/></svg>Cerrar sesión</button>
    </main>

    <!-- ===== Navegación del coach (igual en todas las pantallas del coach) ===== -->
    <nav class="barra-inferior" aria-label="Navegación del coach">
      <a class="barra-inferior__item" href="clientes.html"><svg class="icono" width="22" height="22" aria-hidden="true"><use href="#clientes"/></svg><span>Clientes</span></a>
      <a class="barra-inferior__item" href="plantillas.html"><svg class="icono" width="22" height="22" aria-hidden="true"><use href="#plantillas"/></svg><span>Plantillas</span></a>
      <a class="barra-inferior__mas" href="clientes.html#anadir-cliente" aria-label="Añadir cliente"><svg class="icono icono--grueso" width="26" height="26" aria-hidden="true"><use href="#mas"/></svg></a>
      <a class="barra-inferior__item" href="alimentos-revision.html"><svg class="icono" width="22" height="22" aria-hidden="true"><use href="#alimentos"/></svg><span>Alimentos</span></a>
      <a class="barra-inferior__item" href="perfil.html" aria-current="page"><svg class="icono" width="22" height="22" aria-hidden="true"><use href="#perfil"/></svg><span>Perfil</span></a>
    </nav>
  </div>
  <script type="module" src="../../js/ui/perfil-coach-ui.js"></script>
</body>
</html>
