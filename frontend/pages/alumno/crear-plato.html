<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear plato o comida guardada · Alumno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/pages/alumno.css">
</head>
<body>
  <!-- Iconos de esta página: se dibujan con <svg class="icono"><use href="#nombre"/></svg> -->
  <svg class="sprite" aria-hidden="true">
    <symbol id="flecha-izquierda" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
    <symbol id="volver" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
    <symbol id="mas" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="basura" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
    <symbol id="cruz" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
    <symbol id="hecho" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
  </svg>

  <div class="pantalla">
    <main class="contenido">
      <!-- Cabecera estándar accesible con botón volver a agregar.html / plan.html -->
      <header class="encabezado">
        <a class="btn-icono" href="agregar.html" aria-label="Volver"><svg class="icono" width="22" height="22" aria-hidden="true"><use href="#flecha-izquierda"/></svg></a>
        <div class="encabezado__textos">
          <span class="antetitulo antetitulo--verde">Comida guardada</span>
          <h1 class="titulo">Crear plato o comida guardada</h1>
        </div>
      </header>

      <!-- Formulario accesible para el plato compuesto -->
      <form class="columna gap-l" id="form-crear-plato" novalidate>
        <!-- Nombre del plato -->
        <label class="campo">
          <span class="campo__etiqueta campo__etiqueta--fuerte">Nombre del plato</span>
          <span class="input">
            <input type="text" id="plato-nombre" name="nombre" placeholder="Ej: Almuerzo Proteico, Batido Post-Entreno" autocomplete="off" required>
          </span>
        </label>

        <!-- Selector de categoría -->
        <label class="campo">
          <span class="campo__etiqueta campo__etiqueta--fuerte">Categoría</span>
          <span class="input select-contenedor">
            <select id="plato-categoria" name="categoria" required>
              <option value="Platos preparados" selected>Platos preparados</option>
              <option value="preparaciones">Preparaciones</option>
              <option value="carnes">Carnes</option>
              <option value="pescados">Pescados y mariscos</option>
              <option value="huevos">Huevos</option>
              <option value="lacteos">Lácteos</option>
              <option value="cereales">Cereales, panes y pastas</option>
              <option value="legumbres">Legumbres</option>
              <option value="verduras">Verduras</option>
              <option value="frutas">Frutas</option>
              <option value="grasas">Grasas, aceites y frutos secos</option>
              <option value="bebidas">Bebidas</option>
            </select>
          </span>
        </label>

        <!-- Sección de ingredientes del plato -->
        <section class="columna gap-s" aria-labelledby="t-ingredientes">
          <div class="fila fila--entre align-centro">
            <h2 class="seccion-titulo" id="t-ingredientes">Ingredientes añadidos</h2>
            <a id="btn-agregar-ingrediente" class="btn btn--chico btn--secundario" href="agregar.html?origen=crear-plato">
              <svg class="icono" width="16" height="16" aria-hidden="true"><use href="#mas"/></svg>
              <span>Sumar alimento</span>
            </a>
          </div>

          <!-- Contenedor de ingredientes añadidos -->
          <ul class="grupo grupo--filas" id="lista-ingredientes-plato" aria-label="Ingredientes del plato" hidden>
            <!-- Inyectados dinámicamente mediante template nativo -->
          </ul>

          <!-- Bloque de estado vacío (.vacio) -->
          <section class="vacio" id="estado-vacio-ingredientes">
            <span class="vacio__icono"><svg class="icono" width="32" height="32" aria-hidden="true"><use href="#mas"/></svg></span>
            <p class="sub texto-14">Añade al menos un alimento para formar tu plato</p>
            <a class="btn btn--chico btn--secundario" href="agregar.html?origen=crear-plato">
              <svg class="icono" width="16" height="16" aria-hidden="true"><use href="#mas"/></svg>
              <span>Sumar alimento</span>
            </a>
          </section>
        </section>

        <!-- Tarjeta de resumen de macronutrientes en tiempo real -->
        <section class="card columna gap-s" id="tarjeta-resumen-plato" aria-labelledby="t-resumen-plato">
          <div class="fila fila--entre align-centro">
            <h2 class="seccion-titulo" id="t-resumen-plato">Aporte total del plato</h2>
            <span class="sub texto-12" id="resumen-peso-total">0 g total</span>
          </div>
          <div class="aporte" aria-live="polite">
            <div class="aporte__celda"><span class="aporte__valor" id="total-kcal">0</span><span class="aporte__nombre"><span class="punto punto--kcal"></span>kcal</span></div>
            <div class="aporte__celda"><span class="aporte__valor" id="total-p">0</span><span class="aporte__nombre"><span class="punto punto--p"></span>Prot.</span></div>
            <div class="aporte__celda"><span class="aporte__valor" id="total-c">0</span><span class="aporte__nombre"><span class="punto punto--c"></span>Carb.</span></div>
            <div class="aporte__celda"><span class="aporte__valor" id="total-g">0</span><span class="aporte__nombre"><span class="punto punto--g"></span>Grasas</span></div>
          </div>
          <p class="sub texto-12" id="resumen-por-100g">Valores por 100 g: 0 kcal · P 0 · C 0 · G 0</p>
        </section>

        <!-- Botón principal de guardado -->
        <button type="submit" class="btn btn--primario" id="btn-guardar-plato">Guardar plato</button>
      </form>

      <!-- Plantilla nativa para cada ingrediente -->
      <template id="tpl-ingrediente-plato">
        <li class="alimento-fila" data-id="">
          <div class="alimento-fila__nombre">
            <span class="alimento-fila__titulo" data-ref="nombre"></span>
            <span class="alimento-fila__linea" data-ref="kcal">0 kcal</span>
          </div>
          <div class="fila gap-xs align-centro">
            <span class="input input--angosto input--derecha">
              <input type="number" min="1" max="5000" step="1" data-ref="gramos" placeholder="100">
              <span class="unidad">g</span>
            </span>
          </div>
          <button type="button" class="btn-icono" data-ref="eliminar" aria-label="Eliminar ingrediente">
            <svg class="icono" width="18" height="18" aria-hidden="true"><use href="#basura"/></svg>
          </button>
        </li>
      </template>
    </main>
  </div>
  <script type="module" src="../../js/ui/crear-plato-ui.js"></script>
</body>
</html>
